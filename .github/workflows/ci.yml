name: ci

# Lightweight gates on every push to main, every pull request and every merge
# queue entry: full-history secret scanning and a workflow self-audit. Both jobs
# are copied from intentdriven/Dessau's ci.yml, pins included. Build and test
# jobs join once the code has a test runner (M0).
on:
  push:
    # Main only. Every other branch is tested through its pull request.
    branches:
      - main
  pull_request:
  # The merge queue waits for this workflow's checks on the queue's own ref.
  # Without this trigger, a queue rule would stop every merge.
  merge_group:

# Cancel superseded runs of the same ref. A main push and a merge_group run are
# never cancelled: a cancelled check reads to the queue as a failed entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Secrets never land in history: the whole history OF THE REF UNDER TEST is
  # scanned on every push/PR. Run as a pinned, checksum-verified CLI (not the
  # marketplace action), so it needs no GitHub Advanced Security and its supply
  # chain is hash-anchored. A non-zero exit means gitleaks found a secret.
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history, and it stays full: the scan below walks every commit
          # reachable from HEAD, so a truncated fetch would silently stop
          # examining anything below the cut — including a secret that was
          # committed and later removed.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$base" "$url/$base"
          curl -sSLf -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $base\$" checksums.txt | sha256sum -c -
          tar -xzf "$base" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Scoped to the ref under test, not to every fetched ref
      #. With no --log-opts, gitleaks 8.24.3 runs
      # `git log -p -U0 --full-history --all` (sources.NewGitLogCmd), and --all
      # is every branch and tag the fetch-depth-0 checkout brought down. A
      # finding is anchored to the commit that INTRODUCED the string, so a
      # fixture on any unrelated branch failed THIS ref's run, whose tree
      # contains nothing of it — and clearing it meant rewriting that branch's
      # history, because removing the string later does not retract the finding.
      #
      # A non-empty --log-opts REPLACES those default arguments rather than
      # adding to them: NewGitLogCmd builds `log -p -U0` and appends these words
      # verbatim. So this walks the whole history of the checked-out HEAD and
      # nothing else. Coverage is not lost — a branch push scans its own HEAD, a
      # pull request scans the merge result, a queue entry scans the candidate —
      # so nothing reaches the default branch unscanned.
      #
      # The quoting is deliberate: gitleaks splits this value on spaces and
      # warns about elements that are themselves quoted (upstream #1153), so the
      # shell must strip the quotes and pass `--full-history HEAD` through.
      - name: Scan this ref's history
        run: gitleaks git --redact --no-banner --log-opts='--full-history HEAD' .

  # Audit the workflows themselves (pwn requests, template injection, cache
  # poisoning, unpinned uses). Run as a digest-pinned CLI image (no SARIF upload
  # to code-scanning). A non-zero exit means a finding.
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows
        run: |
          # zizmor v1.26.1, pinned by digest (the registry publishes version
          # releases under :latest; a raw vX.Y.Z tag does not exist).
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /src
